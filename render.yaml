services:
  - type: web
    name: coding-club-api
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: coding-club-backend-shared
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: cron
    name: coding-club-mailer
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: node src/worker.js
    schedule: "*/5 * * * *"
    envVars:
      - fromGroup: coding-club-backend-shared
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

envVarGroups:
  - name: coding-club-backend-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://wfmzhrjdjbkuezsmewjk.supabase.co
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: WORKER_SECRET
        generateValue: true
